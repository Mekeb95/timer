<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="CF Timer"/>
<meta name="theme-color" content="#000000"/>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="stylesheet" href="style.css"/>
<title>CrossFit Timer</title>
</head>
<body>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<div class="main">
  <div class="clock-area">
    <div id="clockLabel" class="clock-label">FOR TIME</div>
    <div id="clock" class="clock">0:00</div>
    <div id="roundLabel" class="round-label"></div>
    <div id="phaseLabel" class="phase-label"></div>
    <div id="tcBadge" class="tc-badge hidden"></div>
    <div id="infoBar" class="info-bar hidden"></div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-reset">↺</button>
    <button class="btn-circle btn-start" id="btnStart">START</button>
    <button class="btn-circle btn-pause hidden" id="btnPause">
      <svg width="28" height="32" viewBox="0 0 28 32" fill="white"><rect x="0" y="0" width="10" height="32" rx="3"/><rect x="18" y="0" width="10" height="32" rx="3"/></svg>
    </button>
    <button id="repBtn" class="rep-btn hidden">
      <span class="rep-count" id="repCount">0</span>
      <span class="rep-label">REPS</span>
    </button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <!-- FOR TIME -->
    <div id="panel-fortime">
      <div class="settings-row">
        <div><label>Timecap</label><div class="settings-hint">Maks tid — økt avsluttes automatisk</div></div>
        <label class="toggle"><input type="checkbox" id="ft-tc-on"><span class="slider"></span></label>
      </div>
      <div class="settings-row" id="ft-tc-row">
        <label>Timecap</label>
        <div class="stepper">
          <button class="sb" data-key="ft-tc" data-delta="-60">−</button>
          <span class="sv" id="ft-tc-val" data-modal-key="ft-tc" data-modal-title="Timecap">20:00</span>
          <button class="sb" data-key="ft-tc" data-delta="60">+</button>
        </div>
      </div>
    </div>

    <!-- AMRAP -->
    <div id="panel-amrap" class="hidden">
      <div class="settings-row">
        <label>Varighet</label>
        <div class="stepper">
          <button class="sb" data-key="amrap-dur" data-delta="-60">−</button>
          <span class="sv" id="amrap-dur-val" data-modal-key="amrap-dur" data-modal-title="Varighet">20:00</span>
          <button class="sb" data-key="amrap-dur" data-delta="60">+</button>
        </div>
      </div>
    </div>

    <!-- EMOM -->
    <div id="panel-emom" class="hidden">
      <div class="settings-row">
        <label>Work</label>
        <div class="stepper">
          <button class="sb" data-key="emom-work" data-delta="-5">−</button>
          <span class="sv" id="emom-work-val" data-modal-key="emom-work" data-modal-title="Work-tid">0:40</span>
          <button class="sb" data-key="emom-work" data-delta="5">+</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Rest</label>
        <div class="stepper">
          <button class="sb" data-key="emom-rest" data-delta="-5">−</button>
          <span class="sv" id="emom-rest-val" data-modal-key="emom-rest" data-modal-title="Rest-tid">0:20</span>
          <button class="sb" data-key="emom-rest" data-delta="5">+</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Runder</label>
        <div class="stepper">
          <button class="sb" data-rounds="-1">−</button>
          <span class="sv" id="emom-rounds-val" data-open-rounds>10</span>
          <button class="sb" data-rounds="1">+</button>
        </div>
      </div>
      <div class="settings-row">
        <div><label>Timecap</label><div class="settings-hint">Maks tid totalt</div></div>
        <label class="toggle"><input type="checkbox" id="emom-tc-on"><span class="slider"></span></label>
      </div>
      <div class="settings-row" id="emom-tc-row">
        <label>Timecap</label>
        <div class="stepper">
          <button class="sb" data-key="emom-tc" data-delta="-60">−</button>
          <span class="sv" id="emom-tc-val" data-modal-key="emom-tc" data-modal-title="Timecap">30:00</span>
          <button class="sb" data-key="emom-tc" data-delta="60">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="tab active" id="tab-fortime" data-mode="fortime">For Time</button>
  <button class="tab" id="tab-amrap" data-mode="amrap">AMRAP</button>
  <button class="tab" id="tab-emom" data-mode="emom">EMOM</button>
</nav>

<!-- TIME MODAL -->
<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <h2 id="modalTitle">Sett tid</h2>
    <div class="modal-inputs">
      <div class="tc"><input class="ti" type="tel" inputmode="numeric" pattern="[0-9]*" id="mMin" placeholder="00"/><span>min</span></div>
      <div class="tsep">:</div>
      <div class="tc"><input class="ti" type="tel" inputmode="numeric" pattern="[0-9]*" id="mSec" placeholder="00"/><span>sek</span></div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel">Avbryt</button>
      <button class="modal-btn ok">OK</button>
    </div>
  </div>
</div>

<!-- PLAY ICON TEMPLATE -->
<template id="tplPlay"><svg width="24" height="28" viewBox="0 0 26 30" fill="white"><polygon points="4,0 26,15 4,30"/></svg></template>

<!-- ROUNDS MODAL -->
<div id="roundsModal" class="modal-bg hidden">
  <div class="modal">
    <h2>Antall runder</h2>
    <div class="modal-inputs">
      <div class="tc"><input class="ti" type="tel" inputmode="numeric" pattern="[0-9]*" id="mRounds" placeholder="10"/><span>runder</span></div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn cancel">Avbryt</button>
      <button class="modal-btn ok">OK</button>
    </div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
